name: Build & Release

on:
  push:
    branches: [hya, main]
    tags: ['v*']
  pull_request:
    branches: [hya, main]

jobs:
  # ── Lint (non-blocking on tag builds) ──────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── Vite build check (Ubuntu, fast) ────────────────────────────────────────
  build-check:
    name: Vite Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # ── Windows .exe build (only on tag push) ──────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + electron-builder
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find installer
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-electron -Filter "*Setup*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Error "No Setup .exe found in dist-electron"; exit 1 }
          echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_OUTPUT
          echo "Found: $($exe.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find_exe.outputs.EXE_PATH }}
          retention-days: 7

      - name: Create / update GitHub Release and attach .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HyaAdPoster ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.find_exe.outputs.EXE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
